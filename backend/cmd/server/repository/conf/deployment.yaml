server:
  hostname: "localhost"
  port: 8090

tls:
  min_version: "1.3"
  cert_file: "repository/resources/security/server.cert"
  key_file: "repository/resources/security/server.key"

database:
  config:
    type: "sqlite"
    sqlite:
      path: "repository/database/configdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  runtime:
    type: "sqlite"
    sqlite:
      path: "repository/database/runtimedb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

  user:
    type: "sqlite"
    sqlite:
      path: "repository/database/userdb.db"
      options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
      max_open_conns: 500
      max_idle_conns: 100
      conn_max_lifetime: 3600

crypto:
  encryption:
    key: "file://repository/resources/security/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "repository/resources/security/signing.cert"
      key_file: "repository/resources/security/signing.key"

jwt:
    preferred_key_id: "default-key"

cors:
  allowed_origins:
    - "https://localhost:3000"
    # - regex: '^https://[a-z0-9-]+\.staging\.example\.com(:[0-9]+)?$'

passkey:
  allowed_origins:
    - "https://localhost:8090"

# OpenID4VP verifier for EUDI Wallet PID presentation. Disabled until RP
# onboarding provides the registered signing certificate and the trusted PID
# issuer certificate (see docs/eudi-notes.md).
openid4vp:
  enabled: false
  # client_id: "x509_hash:<base64url-sha256-of-registered-cert>"
  # signing_key_id: "default-key"          # a crypto.keys[] entry whose cert is registered
  # base_url: "https://localhost:8090"     # request_uri/response_uri are derived from this
  # result_redirect_uri: "https://localhost:3000/eudi/result"
  # credential_id: "pid-sd-jwt"
  # vct: "urn:eudi:pid:de:1"
  # ephemeral_key_id: "vp-enc"
  # requested_claims: ["given_name", "family_name", "birthdate"]
  # mandatory_claims: ["given_name", "family_name"]
  # response_enc_values: ["A128GCM"]
  # request_validity_seconds: 300
  # state_ttl_seconds: 300
  # leeway_seconds: 30
  # trusted_issuers:
  #   - issuer: "https://demo.pid-issuer.bundesdruckerei.de/c"
  #     cert_file: "repository/resources/security/eudi-pid-issuer.cert"

consent:
  enabled: true
  base_url: "http://localhost:9090/api/v1"
